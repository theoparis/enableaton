[package]
name = "enableton"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-ce = { git = "https://github.com/gpui-ce/gpui-ce", default-features = false, features = ["font-kit", "x11"] }
gpui_ce_platform = { git = "https://github.com/gpui-ce/gpui-ce", default-features = false, features = ["x11", "font-kit", "macos-wgpu"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"
